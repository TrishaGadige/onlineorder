<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBite — Food Ordering</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <h1 class="logo">Quick<span>Bite</span></h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search dishes..." aria-label="Search dishes" />
      </div>
      <button class="cart-toggle" id="cartToggle" aria-label="Toggle cart">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <main class="container main-layout">
    <section class="menu-section">
      <div class="category-bar" id="categoryBar">
        <button class="cat-btn active" data-category="All">All</button>
        <button class="cat-btn" data-category="Burgers">Burgers</button>
        <button class="cat-btn" data-category="Pizza">Pizza</button>
        <button class="cat-btn" data-category="Bowls">Bowls</button>
        <button class="cat-btn" data-category="Drinks">Drinks</button>
      </div>

      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <aside class="cart-drawer" id="cartDrawer">
      <div class="cart-header">
        <h2>Your Order</h2>
        <button class="close-cart" id="closeCart" aria-label="Close cart">×</button>
      </div>
      <div class="cart-items" id="cartItems">
        <p class="empty-msg">Your cart is empty.</p>
      </div>
      <div class="cart-footer">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span id="deliveryFee">$2.50</span>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="totalPrice">$0.00</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn" disabled>Place Order</button>
        <p class="order-confirmation" id="orderConfirmation"></p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
